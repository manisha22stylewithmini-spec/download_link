<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grab</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/icon-48.png" alt="" width="28" height="28"><b>Grab</b><button id="gear" type="button" aria-label="Settings">⚙</button></header>
  <main id="main">
    <p id="msg" class="muted">Looking at this page…</p>
    <section id="card" hidden>
      <img id="thumb" alt="">
      <h1 id="title"></h1>
      <p id="sub" class="muted"></p>
      <select id="quality" aria-label="Quality"></select>
      <div class="actions"><button id="saveVideo" class="primary" type="button">Save video</button><button id="saveAudio" type="button">Audio only</button></div>
    </section>
    <form id="manual"><input id="link" type="url" placeholder="…or paste a link" aria-label="Video link"><button type="submit" aria-label="Look up">→</button></form>
  </main>
  <section id="settings" hidden>
    <label>Grab server <input id="api" type="url" placeholder="https://…vercel.app"></label>
    <button id="saveApi" type="button">Save</button>
  </section>
  <script src="popup.js"></script>
</body></html>
